name: Check

on: [push, pull_request]
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 25
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew check
